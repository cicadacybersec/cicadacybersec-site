<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cicada Systems — Secure Demo Access</title>
  <style>
    :root {
      --bg: #000;
      --fg: #e9e9e9;
      --accent: #ff003c;
      --accent-hover: #ff335c;
      --card-bg: #111;
    }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'Segoe UI', Roboto, Inter, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .box {
      background: var(--card-bg);
      padding: 40px 28px;
      border-radius: 12px;
      text-align: center;
      width: 100%;
      max-width: 360px;
      border: 1px solid var(--accent);
      box-shadow: 0 0 25px rgba(255,0,60,0.35);
      animation: fadeIn 0.6s ease;
    }
    h2 {
      margin: 0 0 16px;
      color: var(--accent);
      font-size: 1.4rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
    p.meta {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.65);
      margin-bottom: 22px;
    }
    input {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0 16px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      background: #1a1a1a;
      color: var(--fg);
      font-size: 0.95rem;
      transition: all 0.25s ease;
      outline: none;
    }
    input:focus {
      border: 1px solid var(--accent);
      box-shadow: 0 0 12px rgba(255,0,60,0.5);
    }
    button {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      background: var(--accent);
      border: none;
      border-radius: 6px;
      font-weight: 600;
      color: var(--bg);
      cursor: pointer;
      transition: all 0.25s ease;
      font-size: 1rem;
    }
    button:hover,
    button:focus {
      background: var(--accent-hover);
      box-shadow: 0 0 18px rgba(255,0,60,0.55);
    }
    #err {
      color: #ff5c5c;
      font-size: 0.85rem;
      margin-top: 14px;
      display: none;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>Secure Demo Access</h2>
    <p class="meta">Restricted Preview — Cicada Systems</p>
    <input id="pw" type="password" placeholder="Enter password">
    <button onclick="check()">Access Demo</button>
    <p id="err">Invalid password. Try again.</p>
  </div>

  <script>
    const correct = "cicada2025";
    function check(){
      const input = document.getElementById("pw").value.trim();
      if(input === correct){
        window.location.href = "site.html";
      } else {
        const err = document.getElementById("err");
        err.style.display = "block";
      }
    }
  </script>
</body>
</html>
