<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>demo-2 Demo Access</title>
  <style>
    body{background:#111;color:#eee;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
    .box{background:#1c1c1c;padding:20px;border-radius:8px;text-align:center;max-width:300px;width:100%}
    input{padding:10px;width:100%;margin:10px 0;border:none;border-radius:4px}
    button{padding:10px 16px;background:#00ffc8;border:none;border-radius:4px;cursor:pointer}
    #err{color:#f66;display:none;margin-top:8px}
  </style>
</head>
<body>
  <div class="box">
    <h2>Enter Password</h2>
    <input id="pw" type="password" placeholder="Password">
    <button onclick="check()">Access Demo</button>
    <p id="err">Wrong password</p>
  </div>

  <script>
    const correct = "cicada2025"; // set your password here

    function check(){
      const input = document.getElementById("pw").value;
      if(input === correct){
        window.location.href = "site.html"; // your actual demo file
      } else {
        document.getElementById("err").style.display = "block";
      }
    }
  </script>
</body>
</html>
